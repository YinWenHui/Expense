<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Split3</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px}h1{margin:4px 0;font-size:30px}.sub{color:#687386;margin:0 0 18px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 24px #2233aa12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #dce2ec;font:inherit}button{background:#18243a;color:white;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef2f7;color:#27344a}.danger{background:#fff0f0;color:#b42318}.people{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{width:auto;background:#eef2f7;color:#26344b}.pill.on{background:#dce9ff;color:#1456b8;outline:2px solid #79a9ff}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #edf0f5;padding:11px 0}.row:first-child{border-top:0}.muted{color:#7b8494;font-size:13px}.money{font-weight:800}.settle{padding:13px;background:#f2f7ff;border-radius:13px;margin:8px 0}.good{color:#087443}.bad{color:#b42318}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head>
<body><main class="wrap"><h1>Split3 💸</h1><p class="sub">Simple shared expenses for You, Ann & Khun. Data stays in this browser.</p>
<section class="card"><h3>People</h3><div id="names" class="grid"></div></section>
<section class="card"><h3>Add expense</h3><div class="grid"><input id="desc" placeholder="Expense e.g. Beer"><input id="amt" type="number" step=".01" placeholder="Amount ฿"></div><p class="muted">Paid by</p><select id="payer"></select><p class="muted">Split between</p><div id="parts" class="people"></div><button onclick="addExpense()">Add expense</button></section>
<section class="card"><h3>Previous debt / transfer</h3><p class="muted">Use this for balances from before. Example: Ann owes Khun ฿543.</p><div class="grid"><select id="from"></select><select id="to"></select><input id="debtamt" type="number" step=".01" placeholder="Amount ฿"><button onclick="addDebt()">Add debt</button></div></section>
<section class="card"><h3>Expenses</h3><div id="expenses"></div></section><section class="card"><h3>Final settlement</h3><div id="balances"></div><div id="settlements"></div></section><button class="danger" onclick="resetAll()">Reset all data</button></main>
<script>const D={names:["You","Ann","Khun"],expenses:[],debts:[]};let state=JSON.parse(localStorage.getItem("split3")||"null")||structuredClone(D);let selected=new Set([0,1,2]);const $=id=>document.getElementById(id),money=n=>"฿"+Math.abs(n).toFixed(2);function save(){localStorage.setItem("split3",JSON.stringify(state));render()}function render(){$("names").innerHTML=state.names.map((n,i)=>`<input value="${n}" onchange="state.names[${i}]=this.value;save()">`).join("");const opts=state.names.map((n,i)=>`<option value="${i}">${n}</option>`).join("");["payer","from","to"].forEach(id=>{let v=$(id).value;$(id).innerHTML=opts;if(v)$(id).value=v});$("parts").innerHTML=state.names.map((n,i)=>`<button class="pill ${selected.has(i)?"on":""}" onclick="toggle(${i});return false">${n}</button>`).join("");$("expenses").innerHTML=state.expenses.length?state.expenses.map((e,i)=>`<div class="row"><div><b>${e.desc}</b><div class="muted">${state.names[e.payer]} paid · split ${e.parts.map(x=>state.names[x]).join(", ")}</div></div><div><span class="money">${money(e.amount)}</span> <button class="secondary" style="width:auto;padding:6px 9px" onclick="delE(${i})">×</button></div></div>`).join(""):`<p class="muted">No expenses yet.</p>`;calc()}function toggle(i){selected.has(i)?selected.delete(i):selected.add(i);render()}function addExpense(){let a=+$("amt").value;if(!a||!selected.size)return alert("Enter amount and select at least one person.");state.expenses.push({desc:$("desc").value||"Expense",amount:a,payer:+$("payer").value,parts:[...selected]});$("desc").value="";$("amt").value="";save()}function addDebt(){let a=+$("debtamt").value,f=+$("from").value,t=+$("to").value;if(!a||f==t)return alert("Choose different people and enter an amount.");state.debts.push({from:f,to:t,amount:a});$("debtamt").value="";save()}function delE(i){state.expenses.splice(i,1);save()}function calc(){let b=[0,0,0];state.expenses.forEach(e=>{b[e.payer]+=e.amount;let s=e.amount/e.parts.length;e.parts.forEach(p=>b[p]-=s)});state.debts.forEach(d=>{b[d.from]-=d.amount;b[d.to]+=d.amount});$("balances").innerHTML=b.map((x,i)=>`<div class="row"><b>${state.names[i]}</b><span class="${x>=0?"good":"bad"}">${x>=0?"receives ":"owes "}${money(x)}</span></div>`).join("");let cr=b.map((x,i)=>({i,x})).filter(z=>z.x>.005),db=b.map((x,i)=>({i,x:-x})).filter(z=>z.x>.005),out=[];while(cr.length&&db.length){let c=cr[0],d=db[0],a=Math.min(c.x,d.x);out.push(`${state.names[d.i]} → ${state.names[c.i]}: <b>${money(a)}</b>`);c.x-=a;d.x-=a;if(c.x<.005)cr.shift();if(d.x<.005)db.shift()}$("settlements").innerHTML=out.length?out.map(x=>`<div class="settle">${x}</div>`).join(""):`<div class="settle">All settled ✓</div>`}function resetAll(){if(confirm("Delete all expenses and balances?")){state=structuredClone(D);selected=new Set([0,1,2]);save()}}render();</script></body></html>
